name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The tests start Chroma with Linux Docker images, which aren't available on Windows GitHub-hosted runners.
  test:
    name: 'Test (Chroma ${{ matrix.chroma }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # v1 API only: 0.4.10, the oldest release the client is tested on; 0.4.15 and 0.4.23; 0.5.15, the last
        # release with only the v1 API. v2 API: 0.5.16, the first release with it; 0.5.20; 0.6.3, the last 0.x;
        # 1.0.0, the first 1.x; 1.5.9, the current release; latest catches new releases without blocking.
        chroma: ['0.4.10', '0.4.15', '0.4.23', '0.5.15', '0.5.16', '0.5.20', '0.6.3', '1.0.0', '1.5.9', 'latest']
    continue-on-error: ${{ matrix.chroma == 'latest' }}
    env:
      CHROMA_IMAGE: chromadb/chroma:${{ matrix.chroma }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-

      - name: Build
        run: dotnet build ChromaDB.Testcontainers.slnx -c Release

      - name: Test
        run: |
          dotnet test tests/Testcontainers.Chroma.Tests -c Release --no-build
          dotnet test tests/Testcontainers.Chroma.ImageTests -c Release --no-build

  # Every run packs the module; only a version tag publishes it, with the version set in Directory.Build.props.
  package:
    name: Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-

      - name: Pack
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            dotnet pack src/Testcontainers.Chroma -c Release -o nuget -p:CI=true
            version="${GITHUB_REF_NAME#v}"
            if [[ ! -f "nuget/ChromaDotNet.Testcontainers.$version.nupkg" ]]; then
              echo "The tag $GITHUB_REF_NAME does not match the version in Directory.Build.props:" >&2
              ls nuget >&2
              exit 1
            fi
          else
            dotnet pack src/Testcontainers.Chroma -c Release -o nuget -p:CI=true --version-suffix "ci.$GITHUB_RUN_NUMBER"
          fi

      # The release notes of the package link the GitHub release of its version, so they cannot stay at an older one.
      - name: Check the release notes of the package
        shell: bash
        run: |
          status=0
          for pkg in nuget/*.nupkg; do
            nuspec=$(unzip -p "$pkg" '*.nuspec')
            version=$(echo "$nuspec" | sed -n 's:.*<version>\([0-9.]*\).*</version>.*:\1:p')
            if echo "$nuspec" | grep -Eq "<releaseNotes>.*/releases/tag/v$(echo "$version" | sed 's/\./\\./g')([^0-9]|$)"; then
              echo "$(basename "$pkg"): the release notes link the release v$version"
            else
              echo "::error::$(basename "$pkg"): the release notes do not link the release v$version"
              status=1
            fi
          done
          exit $status

      - name: Upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nuget-packages
          if-no-files-found: error
          path: nuget/*.nupkg

  # NuGet trusted publishing: the NUGET_USER variable names the nuget.org account with a trusted publishing policy
  # for this repository, this workflow and the nuget environment.
  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v') && vars.NUGET_USER != ''
    needs: package
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nuget-packages

      # The build provenance of the package, that the release assets workflow checks and attaches to the release.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '*.nupkg'

      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push ./*.nupkg
          --source "https://api.nuget.org/v3/index.json"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
