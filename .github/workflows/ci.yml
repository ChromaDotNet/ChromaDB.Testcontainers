name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The tests start Chroma with Linux Docker images, which aren't available on Windows GitHub-hosted runners.
  test:
    name: 'Test (Chroma ${{ matrix.chroma }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # v1 API only: 0.4.10, the oldest release the client is tested on; 0.4.15 and 0.4.23; 0.5.15, the last
        # release with only the v1 API. v2 API: 0.5.16, the first release with it; 0.5.20; 0.6.3, the last 0.x;
        # 1.0.0, the first 1.x; 1.5.9, the current release; latest catches new releases without blocking.
        chroma: ['0.4.10', '0.4.15', '0.4.23', '0.5.15', '0.5.16', '0.5.20', '0.6.3', '1.0.0', '1.5.9', 'latest']
    continue-on-error: ${{ matrix.chroma == 'latest' }}
    env:
      CHROMA_IMAGE: chromadb/chroma:${{ matrix.chroma }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-

      - name: Build
        run: dotnet build ChromaDB.Testcontainers.slnx -c Release

      - name: Test
        run: dotnet test tests/Testcontainers.Chroma.Tests -c Release --no-build

  # Every run packs the module; only a version tag publishes it, with the version set in Directory.Build.props.
  package:
    name: Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-

      - name: Pack
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            dotnet pack src/Testcontainers.Chroma -c Release -o nuget -p:CI=true
            version="${GITHUB_REF_NAME#v}"
            if [[ ! -f "nuget/ChromaDotNet.Testcontainers.$version.nupkg" ]]; then
              echo "The tag $GITHUB_REF_NAME does not match the version in Directory.Build.props:" >&2
              ls nuget >&2
              exit 1
            fi
          else
            dotnet pack src/Testcontainers.Chroma -c Release -o nuget -p:CI=true --version-suffix "ci.$GITHUB_RUN_NUMBER"
          fi

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages
          if-no-files-found: error
          path: nuget/*.nupkg

  # NuGet trusted publishing: the NUGET_USER variable names the nuget.org account with a trusted publishing policy
  # for this repository, this workflow and the nuget environment.
  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v') && vars.NUGET_USER != ''
    needs: package
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download
        uses: actions/download-artifact@v7
        with:
          name: nuget-packages

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push ./*.nupkg
          --source "https://api.nuget.org/v3/index.json"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
